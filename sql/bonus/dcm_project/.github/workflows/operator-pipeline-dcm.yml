# Gladstone MRM | Bonus B3 - sample CI/CD for the operator pipeline DCM project
# PR  -> plan (shows the diff) + test (data quality gate)
# main -> deploy, then test again
# Auth: key-pair secrets shown for simplicity. Prefer workload identity federation (OIDC) in
# production so no long-lived key lives in GitHub. Ask CoCo: "set up OIDC for this workflow".
name: operator-pipeline-dcm

on:
  pull_request:
    paths: ['sql/bonus/dcm_project/**']
  push:
    branches: [main]
    paths: ['sql/bonus/dcm_project/**']

env:
  SNOWFLAKE_CONNECTIONS_CI_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_CONNECTIONS_CI_USER: ${{ secrets.SNOWFLAKE_USER }}
  SNOWFLAKE_CONNECTIONS_CI_AUTHENTICATOR: SNOWFLAKE_JWT
  SNOWFLAKE_CONNECTIONS_CI_PRIVATE_KEY_RAW: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
  SNOWFLAKE_CONNECTIONS_CI_ROLE: ${{ vars.DCM_ROLE }}
  SNOWFLAKE_CONNECTIONS_CI_WAREHOUSE: DQ_LAB_WH
  TARGET: ${{ vars.DCM_TARGET }}          # e.g. OPERATOR01

jobs:
  plan-and-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sql/bonus/dcm_project } }
    steps:
      - uses: actions/checkout@v4
      - run: pip install "snowflake-cli>=3.17"
      - run: snow dcm plan --target "$TARGET" -c CI --save-output
      - run: snow dcm test --target "$TARGET" -c CI

  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: sql/bonus/dcm_project } }
    steps:
      - uses: actions/checkout@v4
      - run: pip install "snowflake-cli>=3.17"
      - run: snow dcm deploy --target "$TARGET" -c CI --alias "gh-${{ github.sha }}"
      - run: snow dcm test --target "$TARGET" -c CI
